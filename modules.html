<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COPA Modules – MCQ Practice | MHNJE ITI</title>
  <meta name="description" content="All 15 ITI COPA modules – practise MCQs module-wise in English, Hindi and Marathi.">
  <meta name="theme-color" content="#0b1f4d">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="">
  <div id="app-header"></div>
  <div class="layout">
    <div id="app-sidebar"></div>
    <main class="content"><div class="container">
      <div class="page-head">
        <div class="breadcrumb"><a href="index.html" data-i18n="home">Home</a> / <span data-i18n="practice">MCQ Practice</span></div>
        <h1><i class="fa-solid fa-layer-group" style="color:var(--blue-600)"></i> <span data-i18n="explore">Explore COPA Modules</span></h1>
        <p data-i18n="allModulesDesc"></p>
      </div>
      <div class="module-list" id="moduleList"></div>
    </div></main>
  </div>
  <div id="app-footer"></div>

  <script src="data/questions.js"></script>
  <script src="js/app.js"></script>
  <script>
  (function () {
    var C = window.COPA, t = C.t, esc = C.esc;
    C.renderShell("practice");
    C.applyStatic();
    document.getElementById("moduleList").innerHTML = C.MODULES.map(function (m) {
      var p = C.moduleProgress(m.id);
      var alt = C.lang === "en" ? m.mr : m.en;
      return '<article class="card module-card">' +
        '<div class="top"><span class="s-ic" style="background:' + m.bg + ';color:' + m.color + '"><i class="' + C.iconCls(m) + '"></i></span>' +
        '<div><div class="sub">' + t("module") + ' ' + m.id + ' • ' + p.total + ' ' + t("questions") + '</div><h3>' + esc(C.modName(m)) + '</h3><div class="sub">' + esc(alt) + '</div></div></div>' +
        '<div><div class="score-line"><span>' + t("progress") + '</span><b>' + p.done + '/' + p.total + '</b></div><div class="mini-bar"><i style="width:' + p.pct + '%"></i></div></div>' +
        '<div class="acts">' +
        '<a class="btn btn-primary btn-sm" href="' + C.modulePage(m.id) + '"><i class="fa-solid fa-pen"></i> ' + t("startPractice") + '</a>' +
        '<a class="btn btn-ghost btn-sm" href="' + C.modulePage(m.id) + '#study"><i class="fa-solid fa-book-open"></i> ' + t("openStudy") + '</a>' +
        '<a class="btn btn-yellow btn-sm" href="exam.html?module=' + m.id + '"><i class="fa-solid fa-stopwatch"></i> ' + t("testMode") + '</a>' +
        '</div></article>';
    }).join("");
  })();
  </script>
</body>
</html>
