plugins {
    id 'com.android.application'
}

android {
    namespace 'com.itiexam.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.itiexam.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
