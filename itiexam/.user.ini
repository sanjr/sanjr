; PHP settings for hosts that run PHP as FPM / CGI (they read this file instead of php_flag in .htaccess)
; PHP2Shell (CVE-2026-109618 / CVE-2026-109619): turn off the known attack path. The real fix is a patched PHP version.
session.upload_progress.enabled = 0

; Room for test uploads (a test folder with images, sent as one ZIP of up to 30 MB)
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
